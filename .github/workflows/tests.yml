name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      modo_teste:
        description: 'Escolha o modo de execução dos testes'
        required: true
        default: 'normal'
        type: choice
        options:
          - normal           # Roda todos (com 3 workers)
          - sem-falha        # Exclui o teste de falha (--grep-invert "@falha")
          - apenas-falha     # Roda apenas o teste de falha (--grep "@falha")
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests (Sem o teste de falha)
      if: ${{ github.event.inputs.modo_teste == 'sem-falha' || github.event.inputs.modo_teste == '' }}
      run: npx playwright test --grep-invert "@falha" --workers=3
    - name: Run Playwright tests (Modo Normal)
      if: ${{ github.event.inputs.modo_teste == 'normal' }}
      run: npx playwright test --workers=3
    - name: Run Playwright tests (Apenas o teste de falha)
      if: ${{ github.event.inputs.modo_teste == 'apenas-falha' }}
      run: npx playwright test --grep "@falha" --workers=3
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
