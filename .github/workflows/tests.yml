name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      modo_teste:
        description: 'Escolha o modo de execução dos testes'
        required: true
        default: 'regressao'
        type: choice
        options:
          - smoke          # Roda apenas os testes de fumaça (@smoke)
          - regressao      # Roda a regressão completa sem a falha (--grep-invert "@falha")
          - falha          # Roda exclusivamente o teste de demonstração de falha (@falha)
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      # 1. Roda apenas se o input escolhido for 'smoke'
    - name: Executar Testes Smoke
      if: github.event.inputs.execucao == 'smoke'
      run: npm run test:smoke
      # 2. Roda apenas se o input escolhido for 'regressao' (padrão)
    - name: Executar Regressão
      if: github.event.inputs.execucao == 'regressao' || github.event.inputs.execucao == ''
      run: npm run test:functional
      # 3. Roda apenas se o input escolhido for 'falha'
    - name: Executar Teste de Falha (Demo)
      if: github.event.inputs.execucao == 'falha'
      run: npm run test:failure-demo
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
